[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lionauth"
version = "0.1.0"
description = "A reusable TOTP authentication library for Python"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyotp",
    "qrcode",
]

[tool.setuptools.packages.find]
where = ["src"]